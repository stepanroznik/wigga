<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa348"/>
      <stop offset="1" stop-color="#e66100"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dy="2.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="arrow" d="M0 0 L0 18 L4.6 13.8 L7.6 20.6 L10.6 19.3 L7.7 12.6 L13.4 12.6 Z"/>
  </defs>

  <!-- Tile with a darker bottom edge -->
  <rect x="8" y="12" width="112" height="108" rx="24" fill="#c64600"/>
  <rect x="8" y="8" width="112" height="108" rx="24" fill="url(#tile)"/>

  <!-- Wiggle: ghost positions swinging around the tip -->
  <use href="#arrow" transform="rotate(-20 50 26) translate(50 26) scale(3.1)" fill="#ffffff" fill-opacity="0.28"/>
  <use href="#arrow" transform="rotate(18 50 26) translate(50 26) scale(3.1)" fill="#ffffff" fill-opacity="0.28"/>

  <!-- Motion marks -->
  <path d="M26 60 Q18 76 26 92" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M104 60 Q112 76 104 92" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Pointer -->
  <use href="#arrow" transform="translate(50 26) scale(3.1)" fill="#ffffff" stroke="#241f31" stroke-width="1.3" stroke-linejoin="round" paint-order="stroke" filter="url(#shadow)"/>
</svg>
